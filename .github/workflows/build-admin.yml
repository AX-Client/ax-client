name: Build Admin App

on:
  push:
    tags: ["admin-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-admin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: admin-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: admin-app/src-tauri

      - name: Frontend dependencies
        run: npm ci

      - name: Write admin env
        shell: bash
        run: |
          if [ -n "$AX_BACKEND_URL" ] && [ -n "$AX_ADMIN_SECRET" ]; then
            echo "AX_BACKEND_URL=$AX_BACKEND_URL" >> src-tauri/.env
            echo "AX_ADMIN_SECRET=$AX_ADMIN_SECRET" >> src-tauri/.env
          fi
        env:
          AX_BACKEND_URL: ${{ secrets.AX_BACKEND_URL }}
          AX_ADMIN_SECRET: ${{ secrets.AX_ADMIN_SECRET }}

      - name: Build admin app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: admin-app
          tagName: admin-v__VERSION__
          releaseName: "AX Admin v__VERSION__"
          releaseBody: "Automatischer CI-Build: macOS (Intel + Apple Silicon), Windows"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
