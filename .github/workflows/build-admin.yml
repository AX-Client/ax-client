name: Build Admin App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact: ax-admin-macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            artifact: ax-admin-macos-x64
          - platform: windows-latest
            args: ""
            artifact: ax-admin-windows
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: admin-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: admin-app/src-tauri

      - name: Frontend dependencies
        run: npm ci

      - name: Write admin env
        shell: bash
        run: |
          if [ -n "$AX_BACKEND_URL" ] && [ -n "$AX_ADMIN_SECRET" ]; then
            echo "AX_BACKEND_URL=$AX_BACKEND_URL" >> src-tauri/.env
            echo "AX_ADMIN_SECRET=$AX_ADMIN_SECRET" >> src-tauri/.env
          fi
        env:
          AX_BACKEND_URL: ${{ secrets.AX_BACKEND_URL }}
          AX_ADMIN_SECRET: ${{ secrets.AX_ADMIN_SECRET }}

      - name: Build admin app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: admin-app/src-tauri/target/release/bundle/**
          if-no-files-found: error
