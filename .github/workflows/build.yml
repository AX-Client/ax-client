name: Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact: ax-client-macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            artifact: ax-client-macos-x64
          - platform: ubuntu-22.04
            args: ""
            artifact: ax-client-linux
          - platform: windows-latest
            args: ""
            artifact: ax-client-windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Frontend dependencies
        run: npm ci

      - name: Write backend env
        shell: bash
        run: |
          if [ -n "$AX_BACKEND_URL" ]; then
            echo "AX_BACKEND_URL=$AX_BACKEND_URL" >> src-tauri/.env
            echo "AX_PAYWALL_URL=$AX_PAYWALL_URL" >> src-tauri/.env
            echo "AX_AFFILIATE_URL=$AX_AFFILIATE_URL" >> src-tauri/.env
          fi
        env:
          AX_BACKEND_URL: ${{ secrets.AX_BACKEND_URL }}
          AX_PAYWALL_URL: ${{ secrets.AX_PAYWALL_URL }}
          AX_AFFILIATE_URL: ${{ secrets.AX_AFFILIATE_URL }}

      - name: Build launcher
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
